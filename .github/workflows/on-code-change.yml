# Build the cpr module on every pull request. This workflow publishes nothing.
#
# cpr builds atmosphere-runtime, the only module Jahia maintains and the only one carrying a
# Jahia version. Every other module stays on the upstream 2.5.4.
name: On Code Change (PR)

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set environment variables from parameters
        shell: bash
        run: |
          echo "NEXUS_USERNAME=${{ secrets.NEXUS_USERNAME }}" >> "$GITHUB_ENV"
          echo "NEXUS_PASSWORD=${{ secrets.NEXUS_PASSWORD }}" >> "$GITHUB_ENV"

      # The compiler plugin targets Java 1.7, which recent JDKs refuse.
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: temurin
          cache: maven

      - name: Build with Maven
        shell: bash
        run: >-
          mvn -s .github/maven.settings.xml -ntp -B
          -f modules/cpr/pom.xml
          -Dmaven.javadoc.skip=true -Dgpg.skip=true
          install
