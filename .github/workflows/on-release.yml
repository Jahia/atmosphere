# Release the cpr module from a GitHub pre-release.
#
# To release, create a GitHub pre-release whose target is the maintained branch and whose tag
# follows the convention this repository already uses, atmosphere-project-<version>, for example
# atmosphere-project-2.5.4-jahia1. This workflow deletes the tag GitHub created, because the
# Maven release plugin creates the real one on the release commit.
name: Trigger Release creation

on:
  release:
    types: [prereleased]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.target_commitish }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  on-release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.target_commitish }}
          ssh-key: ${{ secrets.GH_SSH_PRIVATE_KEY_JAHIACI }}

      # The release plugin pushes the release commit and the tag back to the branch.
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.GH_SSH_PRIVATE_KEY_JAHIACI }}

      - name: Set environment variables from parameters
        shell: bash
        run: |
          echo "NEXUS_USERNAME=${{ secrets.NEXUS_USERNAME }}" >> "$GITHUB_ENV"
          echo "NEXUS_PASSWORD=${{ secrets.NEXUS_PASSWORD }}" >> "$GITHUB_ENV"

      # The compiler plugin targets Java 1.7, which recent JDKs refuse.
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: temurin
          cache: maven

      - name: Delete the tag GitHub created for the release
        shell: bash
        run: |
          git config user.email 'jahia-ci@jahia.com'
          git config user.name 'Jahia CI'
          git fetch --all --tags
          git tag --delete '${{ github.event.release.tag_name }}' || true
          git push origin ':refs/tags/${{ github.event.release.tag_name }}'

      - name: Compute the release and the next development version
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ github.event.release.tag_name }}'
          prefix='atmosphere-project-'

          case "$tag" in
            "$prefix"*) release="${tag#"$prefix"}" ;;
            *)
              echo "::error::The tag $tag does not start with $prefix. Name the tag ${prefix}<version>, for example ${prefix}2.5.4-jahia1."
              exit 1
              ;;
          esac

          # A Jahia version of this fork ends in -jahia<N>, so the next development version
          # raises N by one.
          case "$release" in
            *-jahia[0-9]*) ;;
            *)
              echo "::error::The version $release does not end in -jahia<N>, so the next development version cannot be computed."
              exit 1
              ;;
          esac
          base="${release%-jahia*}"
          revision="${release##*-jahia}"
          next="${base}-jahia$((revision + 1))-SNAPSHOT"

          {
            echo "release=$release"
            echo "next=$next"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=Release plan::$release, then $next on ${{ github.event.release.target_commitish }}"

      - name: Release with Maven
        shell: bash
        run: |
          set -euo pipefail
          # The forked build already runs inside modules/cpr, so -f belongs to the outer command
          # only. Passing it in -Darguments makes the fork look for modules/cpr/modules/cpr.
          FORKED="-s ${PWD}/.github/maven.settings.xml -Dmaven.javadoc.skip=true -Dgpg.skip=true"
          OUTER=(-s .github/maven.settings.xml -B -f modules/cpr/pom.xml -Dmaven.javadoc.skip=true -Dgpg.skip=true)
          mvn -ntp "${OUTER[@]}" -DdryRun=false -DskipLocalStaging=true \
            -Dtag='${{ github.event.release.tag_name }}' \
            -DreleaseVersion='${{ steps.versions.outputs.release }}' \
            -DdevelopmentVersion='${{ steps.versions.outputs.next }}' \
            -DscmCommentPrefix='[skip ci] [maven-release-plugin] ' \
            -Darguments="$FORKED" -Dusername=git release:prepare
          mvn -ntp "${OUTER[@]}" -DdryRun=false -DskipLocalStaging=true \
            -Darguments="$FORKED" -Dusername=git release:perform
